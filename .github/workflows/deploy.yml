name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YouTube feed helper
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh latest YouTube videos
        shell: bash
        run: |
          set -e
          if yt-dlp \
            --flat-playlist \
            --playlist-end 3 \
            --dump-single-json \
            "https://www.youtube.com/c/ChadEmery/videos" > youtube-raw.json; then

            python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("youtube-raw.json").read_text(encoding="utf-8"))
          out = []

          for item in (raw.get("entries") or [])[:3]:
              video_id = item.get("id") or item.get("url")
              title = item.get("title") or "YouTube video"
              if not video_id:
                  continue

              out.append({
                  "id": video_id,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg",
              })

          if out:
              Path("youtube-feed.json").write_text(
                  json.dumps(out, indent=2),
                  encoding="utf-8"
              )
              print(f"Generated feed with {len(out)} video(s)")
          else:
              raise SystemExit("No videos returned; keeping repository fallback feed")
          PY
          else
            echo "YouTube refresh failed; using repository fallback feed."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css script.js youtube-feed.json CNAME .nojekyll _site/
          # Crawler files. This list is an allowlist, so anything added to the
          # repo root must be named here or it never reaches the live site.
          cp robots.txt sitemap.xml _site/
          cp -R assets _site/
          cp -R .well-known _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
